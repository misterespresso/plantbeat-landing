<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PlantBeat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #268b07;
            font-size: 2.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #268b07;
        }

        .password-requirements {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #666;
        }

        .password-requirements h4 {
            color: #333;
            margin-bottom: 8px;
        }

        .password-requirements ul {
            list-style: none;
            padding-left: 0;
        }

        .password-requirements li {
            padding: 2px 0;
        }

        .password-requirements li::before {
            content: "• ";
            color: #268b07;
            font-weight: bold;
        }

        .submit-btn {
            width: 100%;
            background: #268b07;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background: #1f7006;
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #268b07;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
        }

        .message.success {
            background: #efe;
            border: 1px solid #cfc;
            color: #363;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #268b07;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .reset-container {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <h1>🌱 PlantBeat</h1>
            <p>Reset Your Password</p>
        </div>

        <div id="message" class="message"></div>

        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <div class="password-requirements">
                <h4>Password Requirements:</h4>
                <ul>
                    <li>At least 8 characters long</li>
                    <li>Contains at least one uppercase letter</li>
                    <li>Contains at least one lowercase letter</li>
                    <li>Contains at least one number</li>
                </ul>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Reset Password
            </button>

            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>Updating your password...</p>
            </div>
        </form>

        <div class="back-link">
            <a href="index.html">← Back to PlantBeat</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase configuration - Same as used in contact.html
        const supabaseUrl = 'https://xvnlxsawllvyrorrrxki.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2bmx4c2F3bGx2eXJvcnJyeGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY3MjA4MzAsImV4cCI6MjA2MjI5NjgzMH0.04BCwHZ-Oz_SCr5_ApoPn1ZY2DYqADIJgsCgiZuBOXU';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        class PasswordReset {
            constructor() {
                this.form = document.getElementById('resetForm');
                this.submitBtn = document.getElementById('submitBtn');
                this.loading = document.getElementById('loading');
                this.message = document.getElementById('message');

                this.init();
            }

            init() {
                this.form.addEventListener('submit', this.handleSubmit.bind(this));

                // Check if we have the necessary URL parameters
                this.checkUrlParams();
            }

            checkUrlParams() {
                let accessToken, refreshToken, type;

                // Check URL fragment (hash) for tokens first
                if (window.location.hash) {
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    accessToken = hashParams.get('access_token');
                    refreshToken = hashParams.get('refresh_token');
                    type = hashParams.get('type');
                }

                // Fallback to query parameters if not found in hash
                if (!accessToken) {
                    const urlParams = new URLSearchParams(window.location.search);
                    accessToken = urlParams.get('access_token');
                    refreshToken = urlParams.get('refresh_token');
                    type = urlParams.get('type');
                }

                if (!accessToken || type !== 'recovery') {
                    this.showMessage('Invalid or missing reset link. Please request a new password reset.', 'error');
                    this.submitBtn.disabled = true;
                    return;
                }

                // Set the session with the tokens from URL
                this.setSession(accessToken, refreshToken);
            }

            async setSession(accessToken, refreshToken) {
                try {
                    const { data, error } = await supabase.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });

                    if (error) {
                        throw error;
                    }

                    console.log('Session set successfully');
                } catch (error) {
                    console.error('Error setting session:', error);
                    this.showMessage('Invalid or expired reset link. Please request a new password reset.', 'error');
                    this.submitBtn.disabled = true;
                }
            }

            validatePassword(password) {
                const requirements = {
                    minLength: password.length >= 8,
                    hasUppercase: /[A-Z]/.test(password),
                    hasLowercase: /[a-z]/.test(password),
                    hasNumber: /\d/.test(password)
                };

                return Object.values(requirements).every(req => req);
            }

            showMessage(text, type) {
                this.message.textContent = text;
                this.message.className = `message ${type}`;
                this.message.style.display = 'block';
            }

            hideMessage() {
                this.message.style.display = 'none';
            }

            setLoading(isLoading) {
                if (isLoading) {
                    this.submitBtn.style.display = 'none';
                    this.loading.style.display = 'block';
                } else {
                    this.submitBtn.style.display = 'block';
                    this.loading.style.display = 'none';
                }
            }

            async handleSubmit(e) {
                e.preventDefault();

                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                this.hideMessage();

                // Validate passwords match
                if (newPassword !== confirmPassword) {
                    this.showMessage('Passwords do not match.', 'error');
                    return;
                }

                // Validate password requirements
                if (!this.validatePassword(newPassword)) {
                    this.showMessage('Password does not meet the requirements.', 'error');
                    return;
                }

                this.setLoading(true);

                try {
                    // Update the user's password
                    const { data, error } = await supabase.auth.updateUser({
                        password: newPassword
                    });

                    if (error) {
                        throw error;
                    }

                    // Clear the password fields for security
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';

                    this.showMessage('Password updated successfully!', 'success');

                    // Redirect after 2 seconds
                    setTimeout(() => {
                        // Check if there's a redirectTo parameter for deep linking back to app
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectTo = urlParams.get('redirectTo');

                        if (redirectTo && redirectTo.startsWith('plantbeat://')) {
                            window.location.href = redirectTo;
                        } else {
                            window.location.href = 'success.html';
                        }
                    }, 2000);

                } catch (error) {
                    console.error('Error updating password:', error);
                    this.showMessage('Failed to update password. Please try again.', 'error');
                } finally {
                    this.setLoading(false);
                }
            }
        }

        // Initialize the password reset functionality when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new PasswordReset();
        });
    </script>
</body>
</html>
